name: Sync examples
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: regenerate docs/examples.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: regenerate
        run: |
          mkdir -p docs
          node scripts/gen-examples.mjs > docs/examples.md
      - name: open pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- docs/examples.md; then
            echo "nothing to sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b automation/examples
          git add docs/examples.md
          git commit -m "docs(examples): regenerate from fixtures" \
            -m "Co-authored-by: arfoux <129370680+arfoux@users.noreply.github.com>"
          git push -u origin automation/examples
          gh pr create --base main --head automation/examples \
            --title "docs(examples): regenerate from fixtures" \
            --body "Generated by scripts/gen-examples.mjs."
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: merge
        if: steps.pr.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh pr list --head automation/examples --json number --jq '.[0].number')
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$number" --squash --delete-branch; then break; fi
            sleep 6
          done
